# Ghostty (fork) — hardened terminal profile
# =============================================
# Reduces the attack surface of in-band terminal control sequences.
#
# Ghostty ships everything ENABLED by default (nothing below is on out of the
# box). This profile opts into the safer subset. Copy the lines you want into
# your ~/.config/ghostty/config.
#
# Risk classes mirror `termprobe` (RISKY / QUESTIONABLE / SAFE) and PROTOCOLS.md.
# Design + new options: docs/agents/plans/2026-08-10-terminal-feature-killswitches.md
#
# ---------------------------------------------------------------------------
# EFFECTIVE TODAY — existing Ghostty options (work on current builds)
# ---------------------------------------------------------------------------

# OSC 52 clipboard — RISKY. Reading lets a remote/app exfiltrate your clipboard;
# writing enables paste-injection. `ask` prompts; `deny` blocks outright.
clipboard-read = deny
clipboard-write = deny

# Keep paste-injection protection on (default; listed for clarity).
clipboard-paste-protection = true

# Title report — do NOT answer "report window title" queries; reading the title
# back is a classic command-injection vector. (Default is already false.)
title-report = false

# OSC 8 hyperlinks — QUESTIONABLE. A link's URI can differ from the shown text
# (phishing). Set false to render link text without the clickable target.
link-osc8 = false

# Desktop notifications (OSC 9 / OSC 777 / OSC 99) — QUESTIONABLE→RISKY.
# Can be used for spam and social engineering; OSC 99 can also carry action
# buttons that report back in-band. Disable the whole channel:
desktop-notifications = false

# Image memory cap — sixel / kitty-graphics / iTerm2 images decode into this
# store. Lower it to bound a memory-exhaustion (DoS) attempt. 32 MiB:
image-storage-limit = 33554432

# ---------------------------------------------------------------------------
# REQUIRES THE FORK KILL-SWITCHES (planned — see the plan doc above)
# Uncomment once implemented. Kept commented so this file still loads today.
# ---------------------------------------------------------------------------

# Preset — disable everything in a risk class at once:
#   off (default) | risky | questionable | all
# Explicit granular options below override the preset.
# terminal-hardening = risky

# Granular switches (default false = feature stays enabled):
# disable-sixel = true               # DCS sixel images (also stops DA1 advertising ;4)
# disable-kitty-graphics = true      # APC G bitmap images (can transfer from files/shmem — RISKY)
# disable-glyph-protocol = true      # APC 25a1 custom-glyph registration (spoofing surface, PUA-limited)
# disable-iterm2 = true              # OSC 1337: inline images, SetUserVar, reports

# Generic OSC blocklist — comma-separated OSC command numbers to ignore.
# Example disables notifications, iTerm2, progress/context/shell markers, text
# sizing, and kitty clipboard while leaving titles/colors intact:
# disable-osc = 9,777,99,1337,3008,633,66,5522
# Special value `all` drops every OSC (extreme; also kills window titles).
